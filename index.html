<!DOCTYPE html>
<html lang="zh-TW">
<head>
<script src="gate-nav.js" data-bar="0" data-askname="0"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>泰北版華文學習大門</title>
<style>
:root{--bg:#fff7e8;--ink:#3b2f2a;--sub:#8a7a70;--shadow:0 6px 18px rgba(120,80,30,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
header{background:linear-gradient(135deg,#ff8a3d,#ffb25e);color:#fff;text-align:center;padding:26px 16px 22px}
header h1{margin:0;font-size:30px;letter-spacing:3px}
header p{margin:8px 0 0;font-size:16px;opacity:.95}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h2{font-size:17px;margin:22px 0 10px;color:var(--sub);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.door{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);border:3px solid transparent;transition:transform .12s,border-color .12s}
.door:hover,.door:focus-visible{transform:translateY(-3px);border-color:var(--c);outline:none}
.ico{flex:none;width:64px;height:64px;border-radius:18px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:34px}
.door b{display:block;font-size:20px}
.door span{display:block;font-size:14px;color:var(--sub);margin-top:2px}
.tag{display:inline-block;font-size:12px;background:#f4ece0;color:#7a6a5c;border-radius:999px;padding:1px 9px;margin-top:6px}

[hidden]{display:none!important}
.namecard{max-width:560px;margin:22px auto 0;padding:22px 20px;background:#fff;border-radius:20px;box-shadow:var(--shadow);text-align:center;border:3px solid #ffd9a8}
.nc-t{font-size:22px;font-weight:800;margin-bottom:6px}
.nc-s{font-size:16px;color:var(--sub);margin-bottom:14px;line-height:1.6}
.nc-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.nc-row input{font:inherit;font-size:20px;text-align:center;padding:10px 12px;border:3px solid #f1e2cc;border-radius:12px;width:230px;outline:none}
.nc-row input:focus{border-color:#ff8a3d}
.nc-row button,.hibar button{font:inherit;font-weight:800;cursor:pointer;border-radius:999px;border:2px solid #ff8a3d;background:#ff8a3d;color:#fff;padding:10px 26px;font-size:18px}
.hibar{max-width:980px;margin:14px auto 0;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:20px;font-weight:800}
.hibar button{font-size:14px;padding:5px 14px;background:#fff;color:#e8692a}
.locked{opacity:.3;pointer-events:none;filter:grayscale(.5)}
footer{text-align:center;color:var(--sub);font-size:13px;padding-bottom:24px}
</style>
</head>
<body>
<header>
  <h1>🏫 泰北版華文學習大門</h1>
  <p>選一個想玩的，開始學習吧！</p>
</header>
<div id="nameCard" class="namecard" hidden>
  <div class="nc-t">👋 歡迎來到華文學習大門！</div>
  <div class="nc-s">你想被叫什麼名字呢？<br>之後在每個遊戲裡，大家都會這樣叫你喔！</div>
  <div class="nc-row"><input id="nameIn" maxlength="12" placeholder="例如：小明、Eric" autocomplete="off"><button id="nameGo" type="button">開始囉！</button></div>
</div>
<div id="hiBar" class="hibar" hidden><span id="hiTxt"></span><button id="nameEdit" type="button">✏️ 改名字</button></div>
<main id="rooms" class="locked">
  <h2>🌱 先打好基礎</h2>
  <div class="grid">
    <a class="door" href="bear/index.html" style="--c:#ffd9a8"><div class="ico">🐻</div><div><b>台灣熊</b><span>注音・拼音練習</span><em class="tag">低年級</em></div></a>
  </div>

  <h2>📚 跟著課本練習</h2>
  <div class="grid">
    <a class="door" href="char/index.html" style="--c:#c9d8ff"><div class="ico">🚀</div><div><b>生字射擊</b><span>看拼音選國字，擊落敵艦</span><em class="tag">生字</em></div></a>
    <a class="door" href="word/index.html" style="--c:#ffd0dc"><div class="ico">🧩</div><div><b>生詞大挑戰</b><span>連線、點燈，把生詞記起來</span><em class="tag">生詞</em></div></a>
    <a class="door" href="rpg/index.html" style="--c:#d4f0c4"><div class="ico">⚔️</div><div><b>勇者試煉</b><span>打怪升級，收服怪獸</span><em class="tag">課文練習</em></div></a>
  </div>

  <h2>🎧 在家也能學</h2>
  <div class="grid">
    <a class="door" href="listen/index.html" style="--c:#c8ece9"><div class="ico">🎧</div><div><b>聽課文・語文天地</b><span>第 1～12 冊，跟著老師唸</span><em class="tag">聽力</em></div></a>
  </div>
</main>
<footer>建議使用電腦或平板的瀏覽器開啟</footer>
<script>
(function(){
  var P = window.HY_PLAYER, $ = function(id){ return document.getElementById(id); };
  var doors = [].slice.call(document.querySelectorAll('a.door'));
  var base = doors.map(function(a){ return a.getAttribute('href'); });
  function apply(){
    var n = P.get();
    $('nameCard').hidden = !!n;
    $('hiBar').hidden = !n;
    $('rooms').classList.toggle('locked', !n);
    if (n) $('hiTxt').textContent = '👋 ' + n + '，選一個想玩的吧！';
    doors.forEach(function(a, i){ a.href = base[i] + (n ? '?name=' + encodeURIComponent(n) : ''); });
  }
  function go(){
    var v = $('nameIn').value.trim();
    if (!v) { $('nameIn').style.borderColor = '#e0533d'; $('nameIn').focus(); return; }
    P.set(v); apply();
  }
  $('nameGo').onclick = go;
  $('nameIn').addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
  $('nameEdit').onclick = function(){ P.ask(function(){ apply(); }, {cancelable: true}); };
  apply();
  if (!P.get()) setTimeout(function(){ $('nameIn').focus(); }, 50);
})();
</script>
</body>
</html>
